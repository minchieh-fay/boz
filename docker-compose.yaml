services:
  boz:
    image: alpine:3.22
    platform: linux/amd64
    working_dir: /app
    command: ["/app/boz-linux-amd64", "-config", "/app/config.json"]
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    volumes:
      - ./boz-linux-amd64:/app/boz-linux-amd64:ro
      - ./config.json:/app/config.json:ro
      - /root/key:/root/key:ro
      - ./data:/app/data
